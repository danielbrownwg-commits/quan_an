          item.className = 'carousel-item';
          item.innerHTML = `<span class="photo-badge">${esc(kindLabels[ph.kind] || 'Photo')}</span>
            ${ph.caption ? `<div class="photo-caption-bar">${esc(ph.caption)}</div>` : ''}`;
          car.appendChild(item);
          DB.getPhotoUrl(ph.blobKey).then(url => {
            if (url) {
              const img = document.createElement('img');
              img.src = url;
              img.alt = ph.caption || place.name;
              item.prepend(img);
              item.onclick = () => openLightbox(url, kindLabels[ph.kind], ph.caption);
            }
          });
        }
      }

      document.getElementById('btn-detail-back').onclick = closeSheet;
      document.getElementById('btn-detail-edit').onclick = () => openPlaceForm(place);
      document.getElementById('btn-detail-fav').onclick = async () => {
        place.favorite = !place.favorite;
        place.updatedAt = new Date().toISOString();
        await DB.put('places', place);
        openPlaceDetail(place.id);
        renderAll();
      };
      document.getElementById('btn-detail-toggle-status').onclick = async () => {
        place.status = place.status === 'visited' ? 'want' : 'visited';
        if (place.status === 'visited' && !place.visitedAt) place.visitedAt = new Date().toISOString().slice(0, 10);
        place.updatedAt = new Date().toISOString();
        await DB.put('places', place);
        openPlaceDetail(place.id);
        renderAll();
      };
      const copyBtn = document.getElementById('btn-copy-addr');
      if (copyBtn) {
        copyBtn.onclick = () => {
          navigator.clipboard?.writeText(place.address);
          showToast('Address copied');
        };
      }
      document.getElementById('btn-detail-del').onclick = () => deletePlaceWithUndo(place);
    }

    function openLightbox(url, badge, caption) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-meta').textContent = badge || '';
      document.getElementById('lightbox-caption').textContent = caption || '';
      document.getElementById('lightbox').classList.add('open');
    }
    document.getElementById('btn-close-lightbox').onclick = () => {
      document.getElementById('lightbox').classList.remove('open');
    };

    /* ==========================================================================
       9. PLACE ADD/EDIT FORM (Dynamic CustomFields + Auto-save Draft + Photo Upload)
       ========================================================================== */
    function getAllUsedTags() {
      const s = new Set();
      State.places.forEach(p => (p.tags || []).forEach(t => s.add(t)));
      return Array.from(s);
    }

    function openPlaceForm(existingPlace = null) {
      const isEdit = Boolean(existingPlace);
      // If adding new and an autosaved draft exists, restore it
      const defaultCat = State.selectedCatId !== 'all' ? State.selectedCatId : (State.categories[0]?.id || 'cat_food');
      const working = existingPlace
        ? JSON.parse(JSON.stringify(existingPlace))
        : (State.settings.draftPlace || {
            id: uid(),
            categoryId: defaultCat,
            name: '',
            status: 'want',
            rating: null,
            review: '',
            address: '',
            mapUrl: '',
            lat: null,
            lng: null,
            hours: '',
            priceLevel: 0,
            tags: [],
            photos: [],
            visitedAt: new Date().toISOString().slice(0, 10),
            favorite: false,
            customValues: {},
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          });

      const sheet = document.getElementById('overlay-sheet');

      const saveDraftIfNeeded = () => {
        if (!isEdit) {
          State.settings.draftPlace = working;
          DB.put('settings', State.settings);
        }
      };

      const renderForm = () => {
        const sortedCats = [...State.categories].sort((a, b) => a.order - b.order);
        const currentCat = State.categories.find(c => c.id === working.categoryId) || sortedCats[0];
        const allTags = getAllUsedTags();

        sheet.innerHTML = `
          <div class="sheet-header">
            <button class="icon-btn" id="btn-form-cancel" aria-label="Close">✕</button>
            <span class="sheet-title">${isEdit ? 'Edit place' : 'Add place'}</span>
            <button class="icon-btn" id="btn-form-fav" aria-label="Favorite">${working.favorite ? '❤️' : '🤍'}</button>
          </div>
          <div class="sheet-body">
            <div class="form-group">
              <label class="form-label">Place name *</label>
              <input class="form-control" id="f-name" value="${esc(working.name)}" placeholder="e.g. Pho Tu Lun, Katinat...">
              <div id="dup-warning" style="color:var(--danger);font-size:0.82rem;margin-top:4px;display:none;"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Category</label>
              <select class="form-control" id="f-cat">
                ${sortedCats.map(c => `<option value="${esc(c.id)}" ${c.id === working.categoryId ? 'selected' : ''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}
              </select>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" class="form-group">
              <div>
                <label class="form-label">Status</label>
                <div class="chip-group">
                  <button type="button" class="choice-chip ${working.status === 'want' ? 'selected' : ''}" data-st="want">Want to go</button>
                  <button type="button" class="choice-chip ${working.status === 'visited' ? 'selected' : ''}" data-st="visited">Visited</button>
                </div>
              </div>
              <div>
                <label class="form-label">Price level</label>
                <div class="chip-group">
                  ${[1, 2, 3, 4].map(pl => `<button type="button" class="choice-chip ${working.priceLevel === pl ? 'selected' : ''}" data-pl="${pl}">${'$'.repeat(pl)}</button>`).join('')}
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Rating (0.5 – 5 stars)</label>
              <div id="form-star-mount"></div>
            </div>

            <!-- Dynamic Category Custom Fields -->
            <div style="padding:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <span style="font-weight:600;font-size:0.95rem;">Custom fields: ${esc(currentCat?.name || '')}</span>
                <button type="button" class="btn-secondary" id="btn-jump-edit-fields" style="min-height:32px;padding:0 10px;font-size:0.8rem;">⚙️ Edit fields</button>
              </div>
              <div id="custom-fields-mount"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Photos (auto-compressed ≤ 1600px)</label>
              <label class="btn-secondary" style="display:inline-flex;cursor:pointer;margin-bottom:6px;">
                📷 Choose / take photos
                <input type="file" id="f-photo-input" accept="image/*" multiple style="display:none">
              </label>
              <div class="photo-edit-grid" id="form-photo-grid"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Review / Notes</label>
              <textarea class="form-control" id="f-review" placeholder="Great dishes, atmosphere, parking tips...">${esc(working.review)}</textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Tags (comma-separated)</label>
              <input class="form-control" id="f-tags" list="tag-suggestions" value="${esc((working.tags || []).join(', '))}" placeholder="banh cuon, breakfast, stay long">
              <datalist id="tag-suggestions">
                ${allTags.map(t => `<option value="${esc(t)}">`).join('')}
              </datalist>
            </div>

            <div class="form-group">
              <label class="form-label">Google Maps link (paste to auto-extract name/coordinates)</label>
              <input class="form-control" id="f-mapurl" value="${esc(working.mapUrl)}" placeholder="https://www.google.com/maps/place/...">
            </div>

            <div class="form-group">
              <label class="form-label">Address</label>
              <input class="form-control" id="f-address" value="${esc(working.address)}" placeholder="Street number, street, district...">
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" class="form-group">
              <div>
                <label class="form-label">Opening hours</label>
                <input class="form-control" id="f-hours" value="${esc(working.hours)}" placeholder="07:00–21:00">
              </div>
              <div>
                <label class="form-label">Last visit date</label>
                <input type="date" class="form-control" id="f-visited" value="${esc(working.visitedAt || '')}">
              </div>
            </div>
          </div>

          <div class="sheet-footer-fixed">
            <button type="button" class="btn-secondary" id="btn-form-discard" style="flex:1;">Cancel</button>
            <button type="button" class="btn-primary" id="btn-form-save" style="flex:2;">Save place</button>
          </div>`;

        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');

        bindStarPicker(document.getElementById('form-star-mount'), working.rating, (val) => {
          working.rating = val;
          saveDraftIfNeeded();
        });

        renderCustomFieldsInputs(currentCat, working, saveDraftIfNeeded);
        renderPhotoEditGrid(working, saveDraftIfNeeded);

        // Bindings
        const nameInput = document.getElementById('f-name');
        const dupWarn = document.getElementById('dup-warning');
        nameInput.oninput = () => {
          working.name = nameInput.value;
          const norm = vnNorm(working.name);
          const dup = norm && State.places.find(p => p.id !== working.id && vnNorm(p.name) === norm);
          if (dup) {
            dupWarn.style.display = 'block';
            dupWarn.textContent = `⚠️ A place with this name already exists: "${dup.name}"`;
          } else {
            dupWarn.style.display = 'none';
          }
          saveDraftIfNeeded();
        };

        // Note: when a place's category changes, we keep the old data in working.customValues so nothing is lost if it is switched back
        document.getElementById('f-cat').onchange = (e) => {
          working.categoryId = e.target.value;
          saveDraftIfNeeded();
          renderForm();
        };

        sheet.querySelectorAll('[data-st]').forEach(btn => {
          btn.onclick = () => {
            working.status = btn.dataset.st;
            saveDraftIfNeeded();
            renderForm();
          };
        });

        sheet.querySelectorAll('[data-pl]').forEach(btn => {
          btn.onclick = () => {
            const p = parseInt(btn.dataset.pl, 10);
            working.priceLevel = working.priceLevel === p ? 0 : p;
            saveDraftIfNeeded();
            renderForm();
          };
        });

        document.getElementById('f-review').oninput = (e) => { working.review = e.target.value; saveDraftIfNeeded(); };
        document.getElementById('f-address').oninput = (e) => { working.address = e.target.value; saveDraftIfNeeded(); };
        document.getElementById('f-hours').oninput = (e) => { working.hours = e.target.value; saveDraftIfNeeded(); };
        document.getElementById('f-visited').oninput = (e) => { working.visitedAt = e.target.value || null; saveDraftIfNeeded(); };
        document.getElementById('f-tags').oninput = (e) => {
          working.tags = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
          saveDraftIfNeeded();
        };

        document.getElementById('f-mapurl').oninput = (e) => {
          working.mapUrl = e.target.value.trim();
          const parsed = parseGoogleMapsUrl(working.mapUrl);
          if (parsed.lat !== null) { working.lat = parsed.lat; working.lng = parsed.lng; }
          if (parsed.name && !working.name) {
            working.name = parsed.name;
            nameInput.value = parsed.name;
            showToast(`Extracted name: ${parsed.name}`);
          }
          saveDraftIfNeeded();
        };

        document.getElementById('f-photo-input').onchange = async (e) => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          showToast(`Compressing ${files.length} photos...`, null, null, 2000);
          for (const file of files) {
            try {
              const { fullBlob, thumbBlob } = await compressImageFile(file);
              const blobKey = 'img_' + uid();
              const thumbKey = 'th_' + uid();
              await DB.put('photos', { key: blobKey, blob: fullBlob });
              await DB.put('photos', { key: thumbKey, blob: thumbBlob });
              working.photos.push({ id: uid(), blobKey, thumbKey, caption: '', kind: 'food' });
            } catch (err) {
              showToast('Could not compress photo: ' + err.message);
            }
          }
          saveDraftIfNeeded();
          renderPhotoEditGrid(working, saveDraftIfNeeded);
        };

        document.getElementById('btn-form-fav').onclick = () => {
          working.favorite = !working.favorite;
          saveDraftIfNeeded();
          renderForm();
        };

        document.getElementById('btn-jump-edit-fields').onclick = () => {
          openCategoryFieldsEditor(currentCat.id, () => openPlaceForm(working));
        };

document.getElementById('btn-form-cancel').onclick = closeSheet;
     document.getElementById('btn-form-discard').onclick = async () => {
       if (!isEdit) {
         State.settings.draftPlace = null;
         await DB.put('settings', State.settings);
       }
       await garbageCollectPhotos();
       closeSheet();
     };

     document.getElementById('btn-form-save').onclick = async () => {
       if (!working.name.trim()) {
         showToast('Please enter a place name');
         nameInput.focus();
         return;
       }
       working.name = working.name.trim();
       working.updatedAt = new Date().toISOString();
       const idx = State.places.findIndex(p => p.id === working.id);
       if (idx >= 0) State.places[idx] = working;
       else State.places.push(working);

       await DB.put('places', working);
       if (!isEdit) {
         State.settings.draftPlace = null;
         await DB.put('settings', State.settings);
       }
       await garbageCollectPhotos();
       closeSheet();
       renderAll();
       showToast('Place saved');
     };
   };

   renderForm();
 }

    function renderCustomFieldsInputs(cat, working, onUpdate) {
      const mount = document.getElementById('custom-fields-mount');
      if (!cat || !cat.fields || cat.fields.length === 0) {
        mount.innerHTML = `<div style="font-size:0.85rem;color:var(--text-muted);">This category has no custom fields yet.</div>`;
        return;
      }
      working.customValues = working.customValues || {};
      mount.innerHTML = '';

      for (const fd of [...cat.fields].sort((a, b) => a.order - b.order)) {
        const wrap = document.createElement('div');
        wrap.className = 'form-group';
        wrap.style.marginBottom = '10px';
        const val = working.customValues[fd.id];

        if (fd.type === 'checkbox') {
          wrap.innerHTML = `
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;min-height:38px;">
              <input type="checkbox" ${val ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--accent);">
              <span style="font-weight:600;font-size:0.92rem;">${esc(fd.label)}</span>
            </label>`;
          wrap.querySelector('input').onchange = (e) => {
            working.customValues[fd.id] = e.target.checked;
            onUpdate();
          };
        } else if (fd.type === 'select') {
          wrap.innerHTML = `<label class="form-label">${esc(fd.label)}</label>
            <div class="chip-group">
              ${(fd.options || []).map(opt => `<button type="button" class="choice-chip ${val === opt ? 'selected' : ''}" data-opt="${esc(opt)}">${esc(opt)}</button>`).join('')}
            </div>`;
          wrap.querySelectorAll('[data-opt]').forEach(btn => {
            btn.onclick = () => {
              const o = btn.dataset.opt;
              working.customValues[fd.id] = working.customValues[fd.id] === o ? '' : o;
              onUpdate();
              renderCustomFieldsInputs(cat, working, onUpdate);
            };
          });
        } else if (fd.type === 'multiselect') {
          const arr = Array.isArray(val) ? val : [];
          wrap.innerHTML = `<label class="form-label">${esc(fd.label)}</label>
            <div class="chip-group">
              ${(fd.options || []).map(opt => `<button type="button" class="choice-chip ${arr.includes(opt) ? 'selected' : ''}" data-opt="${esc(opt)}">${esc(opt)}</button>`).join('')}
            </div>`;
          wrap.querySelectorAll('[data-opt]').forEach(btn => {
            btn.onclick = () => {
              const o = btn.dataset.opt;
              const cur = Array.isArray(working.customValues[fd.id]) ? [...working.customValues[fd.id]] : [];
              const i = cur.indexOf(o);
              if (i >= 0) cur.splice(i, 1);
              else cur.push(o);
              working.customValues[fd.id] = cur;
              onUpdate();
              renderCustomFieldsInputs(cat, working, onUpdate);
            };
          });
        } else if (fd.type === 'rating') {
          wrap.innerHTML = `<label class="form-label">${esc(fd.label)}</label><div class="custom-star-sub"></div>`;
          bindStarPicker(wrap.querySelector('.custom-star-sub'), val || null, (newR) => {
            working.customValues[fd.id] = newR;
            onUpdate();
          });
        } else if (fd.type === 'longtext') {
          wrap.innerHTML = `<label class="form-label">${esc(fd.label)}</label>
            <textarea class="form-control" style="min-height:68px;">${esc(val || '')}</textarea>`;
          wrap.querySelector('textarea').oninput = (e) => {
            working.customValues[fd.id] = e.target.value;
            onUpdate();
          };
        } else {
          const inputType = fd.type === 'number' ? 'number' : fd.type === 'date' ? 'date' : fd.type === 'url' ? 'url' : 'text';
          wrap.innerHTML = `<label class="form-label">${esc(fd.label)}</label>
            <input type="${inputType}" class="form-control" value="${esc(val ?? '')}">`;
          wrap.querySelector('input').oninput = (e) => {
            working.customValues[fd.id] = fd.type === 'number' ? (e.target.value === '' ? null : parseFloat(e.target.value)) : e.target.value;
            onUpdate();
          };
        }
        mount.appendChild(wrap);
      }
    }

    function renderPhotoEditGrid(working, onUpdate) {
      const grid = document.getElementById('form-photo-grid');
      if (!grid) return;
      grid.innerHTML = '';
      (working.photos || []).forEach((ph, idx) => {
        const card = document.createElement('div');
        card.className = 'photo-edit-card';
        card.innerHTML = `
          <div class="ph-preview" style="height:110px;background:var(--surface-2);border-radius:6px;overflow:hidden;"></div>
          <select class="form-control" style="min-height:34px;padding:2px 6px;font-size:0.82rem;">
            <option value="menu" ${ph.kind === 'menu' ? 'selected' : ''}>📋 Menu</option>
            <option value="food" ${ph.kind === 'food' ? 'selected' : ''}>🍲 Food</option>
            <option value="place" ${ph.kind === 'place' ? 'selected' : ''}>🏠 Space</option>
            <option value="other" ${ph.kind === 'other' ? 'selected' : ''}>📷 Other</option>
          </select>
          <input class="form-control" style="min-height:34px;padding:2px 6px;font-size:0.82rem;" placeholder="Caption..." value="${esc(ph.caption || '')}">
          <button type="button" class="clear-filters-btn" style="font-size:0.8rem;">Remove photo</button>`;

        DB.getPhotoUrl(ph.thumbKey || ph.blobKey).then(url => {
          if (url) card.querySelector('.ph-preview').innerHTML = `<img src="${url}" alt="">`;
        });

        card.querySelector('select').onchange = (e) => { ph.kind = e.target.value; onUpdate(); };
        card.querySelector('input').oninput = (e) => { ph.caption = e.target.value; onUpdate(); };
        card.querySelector('button').onclick = async () => {
          working.photos.splice(idx, 1);
          onUpdate();
          renderPhotoEditGrid(working, onUpdate);
        };
        grid.appendChild(card);
      });
    }

    /* ==========================================================================
       10. FILTER BOTTOM SHEET (§5.3 + CustomField filters §6b)
       ========================================================================== */
    function openFilterModal() {
      const f = State.filters;
      const currentCat = State.selectedCatId !== 'all' ? State.categories.find(c => c.id === State.selectedCatId) : null;

      // Get the tags present in the current category
      const tagSet = new Set();
      State.places.forEach(p => {
        if (State.selectedCatId === 'all' || p.categoryId === State.selectedCatId) {
          (p.tags || []).forEach(t => tagSet.add(t));
        }
      });
      const catTags = Array.from(tagSet);

      let customFilterHtml = '';
      if (currentCat) {
        const filterableFields = (currentCat.fields || []).filter(fd => fd.filterable);
        if (filterableFields.length > 0) {
          customFilterHtml += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
            <div class="form-label" style="color:var(--accent);">Filter by ${esc(currentCat.name)}</div>`;
          for (const fd of filterableFields) {
            const curVal = f.custom[fd.id];
            if (fd.type === 'select' || fd.type === 'multiselect') {
              const selArr = Array.isArray(curVal) ? curVal : [];
              customFilterHtml += `<div class="form-group"><label class="form-label">${esc(fd.label)}</label>
                <div class="chip-group">
                  ${(fd.options || []).map(o => `<button type="button" class="choice-chip ${selArr.includes(o) ? 'selected' : ''}" data-cf-multi="${esc(fd.id)}" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}
                </div></div>`;
            } else if (fd.type === 'checkbox') {
              const st = curVal || 'all';
              customFilterHtml += `<div class="form-group"><label class="form-label">${esc(fd.label)}</label>
                <div class="chip-group">
                  ${[['all', 'All'], ['yes', 'Yes'], ['no', 'No']].map(([k, lbl]) => `<button type="button" class="choice-chip ${st === k ? 'selected' : ''}" data-cf-bool="${esc(fd.id)}" data-val="${k}">${lbl}</button>`).join('')}
                </div></div>`;
            } else if (fd.type === 'number') {
              const minV = curVal?.min ?? '';
              const maxV = curVal?.max ?? '';
              customFilterHtml += `<div class="form-group"><label class="form-label">${esc(fd.label)} (Min – Max)</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <input type="number" class="form-control" data-cf-num="${esc(fd.id)}" data-bound="min" placeholder="From..." value="${esc(minV)}">
                  <input type="number" class="form-control" data-cf-num="${esc(fd.id)}" data-bound="max" placeholder="To..." value="${esc(maxV)}">
                </div></div>`;
            }
          }
          customFilterHtml += `</div>`;
        }
      }

      openModal('Filter & Sort', `
        <div class="form-group">
          <label class="form-label">Sort by</label>
          <div class="chip-group">
            ${[['newest', 'Newest'], ['rating', 'Rating high→low'], ['name', 'Name A→Z'], ['visited', 'Recently visited']].map(([k, lbl]) => `
              <button type="button" class="choice-chip ${f.sortBy === k ? 'selected' : ''}" data-sort="${k}">${lbl}</button>`).join('')}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Status</label>
          <div class="chip-group">
            ${[['all', 'All'], ['visited', 'Visited'], ['want', 'Want to go']].map(([k, lbl]) => `
              <button type="button" class="choice-chip ${f.status === k ? 'selected' : ''}" data-f-status="${k}">${lbl}</button>`).join('')}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Minimum rating</label>
          <div class="chip-group">
            ${[[0, 'All'], [3, '≥ 3★'], [4, '≥ 4★'], [4.5, '≥ 4.5★'], [-1, 'Unrated']].map(([k, lbl]) => `
              <button type="button" class="choice-chip ${f.minRating === k ? 'selected' : ''}" data-f-rating="${k}">${lbl}</button>`).join('')}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Price level</label>
          <div class="chip-group">
            ${[1, 2, 3, 4].map(p => `<button type="button" class="choice-chip ${f.prices.includes(p) ? 'selected' : ''}" data-f-price="${p}">${'$'.repeat(p)}</button>`).join('')}
          </div>
        </div>

        <div class="form-group">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <input type="checkbox" id="f-only-fav" ${f.onlyFav ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--accent);">
            <span style="font-weight:600;">Show favorites only (♥)</span>
          </label>
        </div>

        ${catTags.length ? `<div class="form-group">
          <label class="form-label">Tags</label>
          <div class="chip-group">
            ${catTags.map(t => `<button type="button" class="choice-chip ${f.tags.includes(t) ? 'selected' : ''}" data-f-tag="${esc(t)}">#${esc(t)}</button>`).join('')}
          </div>
        </div>` : ''}

        ${customFilterHtml}

        <div style="display:flex;gap:10px;margin-top:16px;">
          <button type="button" class="btn-secondary" id="btn-reset-modal-filter" style="flex:1;">Reset</button>
          <button type="button" class="btn-primary" id="btn-apply-modal-filter" style="flex:2;">Show results</button>
        </div>
      `, (box) => {
        box.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { f.sortBy = b.dataset.sort; openFilterModal(); renderAll(); });
        box.querySelectorAll('[data-f-status]').forEach(b => b.onclick = () => { f.status = b.dataset.fStatus; openFilterModal(); renderAll(); });
        box.querySelectorAll('[data-f-rating]').forEach(b => b.onclick = () => { f.minRating = parseFloat(b.dataset.fRating); openFilterModal(); renderAll(); });
        box.querySelectorAll('[data-f-price]').forEach(b => b.onclick = () => {
          const p = parseInt(b.dataset.fPrice, 10);
          const idx = f.prices.indexOf(p);
          if (idx >= 0) f.prices.splice(idx, 1); else f.prices.push(p);
          openFilterModal(); renderAll();
        });
        box.querySelector('#f-only-fav').onchange = (e) => { f.onlyFav = e.target.checked; renderAll(); };
        box.querySelectorAll('[data-f-tag]').forEach(b => b.onclick = () => {
          const t = b.dataset.fTag;
          const idx = f.tags.indexOf(t);
          if (idx >= 0) f.tags.splice(idx, 1); else f.tags.push(t);
          openFilterModal(); renderAll();
        });

        box.querySelectorAll('[data-cf-multi]').forEach(b => b.onclick = () => {
          const id = b.dataset.cfMulti;
          const opt = b.dataset.opt;
          const cur = Array.isArray(f.custom[id]) ? [...f.custom[id]] : [];
          const i = cur.indexOf(opt);
          if (i >= 0) cur.splice(i, 1); else cur.push(opt);
          if (cur.length === 0) delete f.custom[id]; else f.custom[id] = cur;
          openFilterModal(); renderAll();
        });

        box.querySelectorAll('[data-cf-bool]').forEach(b => b.onclick = () => {
          const id = b.dataset.cfBool;
          const val = b.dataset.val;
          if (val === 'all') delete f.custom[id]; else f.custom[id] = val;
          openFilterModal(); renderAll();
        });

        box.querySelectorAll('[data-cf-num]').forEach(inp => inp.oninput = () => {
          const id = inp.dataset.cfNum;
          const bound = inp.dataset.bound;
          f.custom[id] = f.custom[id] || { min: '', max: '' };
          f.custom[id][bound] = inp.value;
          if (!f.custom[id].min && !f.custom[id].max) delete f.custom[id];
          renderAll();
        });

        box.querySelector('#btn-reset-modal-filter').onclick = () => {
          State.filters = { status: 'all', minRating: 0, prices: [], tags: [], onlyFav: false, custom: {}, sortBy: 'newest' };
          openFilterModal();
          renderAll();
        };
        box.querySelector('#btn-apply-modal-filter').onclick = closeModal;
      });
    }

    /* ==========================================================================
       11. STATS VIEW (SVG/HTML Visualization §5.4)
       ========================================================================== */
    function renderStatsView() {
      const main = document.getElementById('main-view');
      const total = State.places.length;
      const visited = State.places.filter(p => p.status === 'visited').length;
      const want = total - visited;
      const visitedPct = total ? Math.round((visited / total) * 100) : 0;

      // Theo category
      const catCounts = State.categories.map(c => ({
        cat: c,
        count: State.places.filter(p => p.categoryId === c.id).length
      })).sort((a, b) => b.count - a.count);
      const maxCat = Math.max(1, ...catCounts.map(x => x.count));

      // Rating distribution (0.5 -> 5.0)
      const ratingBins = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
      const ratingCounts = ratingBins.map(r => ({
        r,
        c: State.places.filter(p => p.rating === r).length
      }));
      const maxR = Math.max(1, ...ratingCounts.map(x => x.c));

      // Activity, last 12 months
      const months = [];
      const now = new Date();
      for (let i = 11; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const c = State.places.filter(p => (p.visitedAt || p.createdAt || '').startsWith(ym)).length;
        months.push({ ym, label: `${d.getMonth() + 1}/${String(d.getFullYear()).slice(-2)}`, c });
      }
      const maxM = Math.max(1, ...months.map(m => m.c));

      // Top tags
      const tagMap = {};
      State.places.forEach(p => (p.tags || []).forEach(t => { tagMap[t] = (tagMap[t] || 0) + 1; }));
      const topTags = Object.entries(tagMap).sort((a, b) => b[1] - a[1]).slice(0, 10);

      // Top 5 rated
      const topRated = [...State.places].filter(p => p.rating !== null).sort((a, b) => b.rating - a.rating).slice(0, 5);

      // List every select/checkbox CustomField to show its distribution
      const customAnalyzable = [];
      for (const c of State.categories) {
        for (const fd of (c.fields || [])) {
          if (['select', 'multiselect', 'checkbox'].includes(fd.type)) {
            customAnalyzable.push({ key: `${c.id}::${fd.id}`, label: `${c.icon} ${c.name} — ${fd.label}`, cat: c, field: fd });
          }
        }
      }
      if (!State.statsCustomFieldId && customAnalyzable.length) {
        State.statsCustomFieldId = customAnalyzable[0].key;
      }

      let customDistHtml = '';
      const chosenMeta = customAnalyzable.find(x => x.key === State.statsCustomFieldId);
      if (chosenMeta) {
        const distMap = {};
        const catPlaces = State.places.filter(p => p.categoryId === chosenMeta.cat.id);
        for (const p of catPlaces) {
          const v = p.customValues ? p.customValues[chosenMeta.field.id] : undefined;
          if (chosenMeta.field.type === 'checkbox') {
            const k = v ? 'Yes' : 'No';
            distMap[k] = (distMap[k] || 0) + 1;
          } else if (Array.isArray(v)) {
            v.forEach(item => { distMap[item] = (distMap[item] || 0) + 1; });
          } else if (v) {
            distMap[v] = (distMap[v] || 0) + 1;
          }
        }
        const entries = Object.entries(distMap);
        const maxC = Math.max(1, ...entries.map(e => e[1]));
        customDistHtml = entries.length ? entries.map(([k, cnt]) => `
          <div class="bar-row tabular-nums">
            <span class="bar-label">${esc(k)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(cnt / maxC) * 100}%"></div></div>
            <span class="bar-val">${cnt}</span>
          </div>`).join('') : `<div style="font-size:0.85rem;color:var(--text-muted);">No data for this field yet.</div>`;
      }

      main.innerHTML = `
        <div class="stat-card">
          <h3 class="stat-title">Places overview</h3>
          <div style="display:flex;align-items:center;gap:18px;">
            <svg width="96" height="96" viewBox="0 0 36 36">
              <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--surface-2)" stroke-width="4"/>
              <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="${visitedPct}, 100"/>
              <text x="18" y="20.5" text-anchor="middle" fill="var(--text)" font-size="7.5" font-weight="600">${visitedPct}%</text>
            </svg>
            <div class="tabular-nums" style="flex:1;display:flex;flex-direction:column;gap:6px;">
              <div>Total: <strong>${total}</strong> places</div>
              <div style="color:var(--accent);cursor:pointer;" data-jump-status="visited">✓ Visited: <strong>${visited}</strong></div>
              <div style="color:var(--text-muted);cursor:pointer;" data-jump-status="want">☆ Want to go: <strong>${want}</strong></div>
            </div>
          </div>
        </div>

        <div class="stat-card">
          <h3 class="stat-title">By category (tap to filter)</h3>
          ${catCounts.map(({ cat, count }) => `
            <div class="bar-row tabular-nums" data-jump-cat="${esc(cat.id)}">
              <span class="bar-label">${esc(cat.icon)} ${esc(cat.name)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(count / maxCat) * 100}%"></div></div>
              <span class="bar-val">${count}</span>
            </div>`).join('')}
        </div>

        <div class="stat-card">
          <h3 class="stat-title">Rating distribution (0.5 – 5★)</h3>
          <div style="display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:14px;">
            ${ratingCounts.map(({ r, c }) => `
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span class="tabular-nums" style="font-size:0.7rem;color:var(--text-muted);">${c || ''}</span>
                <div style="width:100%;background:var(--star);border-radius:4px 4px 0 0;height:${Math.max(4, Math.round((c / maxR) * 72))}px;opacity:${c ? 1 : 0.2};"></div>
                <span class="tabular-nums" style="font-size:0.72rem;">${r}</span>
              </div>`).join('')}
          </div>
        </div>

        <div class="stat-card">
          <h3 class="stat-title">Activity, last 12 months</h3>
          <div style="display:flex;align-items:flex-end;gap:4px;height:115px;padding-top:14px;">
            ${months.map(m => `
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
                <span class="tabular-nums" style="font-size:0.68rem;color:var(--text-muted);">${m.c || ''}</span>
                <div style="width:100%;background:var(--accent);border-radius:4px 4px 0 0;height:${Math.max(4, Math.round((m.c / maxM) * 72))}px;opacity:${m.c ? 1 : 0.2};"></div>
                <span class="tabular-nums" style="font-size:0.62rem;writing-mode:vertical-rl;transform:rotate(180deg);height:28px;">${m.label}</span>
              </div>`).join('')}
          </div>
        </div>

        ${customAnalyzable.length ? `
        <div class="stat-card">
          <h3 class="stat-title">Distribution by custom field</h3>
          <select class="form-control" id="stat-custom-select" style="margin-bottom:12px;">
            ${customAnalyzable.map(item => `<option value="${esc(item.key)}" ${item.key === State.statsCustomFieldId ? 'selected' : ''}>${esc(item.label)}</option>`).join('')}
          </select>
          ${customDistHtml}
        </div>` : ''}

        <div class="stat-card">
          <h3 class="stat-title">Top rated</h3>
          ${topRated.length ? topRated.map(p => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" data-open-place="${esc(p.id)}">
              <span style="font-weight:600;">${esc(p.name)}</span>
              <span class="rating-inline tabular-nums">★ ${p.rating}</span>
            </div>`).join('') : '<div style="color:var(--text-muted);font-size:0.9rem;">No places rated yet.</div>'}
        </div>

        <div class="stat-card">
          <h3 class="stat-title">Top Tags</h3>
          <div class="chip-group">
            ${topTags.length ? topTags.map(([t, c]) => `<button class="choice-chip" data-jump-tag="${esc(t)}">#${esc(t)} (${c})</button>`).join('') : '<span style="color:var(--text-muted);font-size:0.9rem;">No tags yet.</span>'}
          </div>
        </div>`;

      main.querySelectorAll('[data-jump-cat]').forEach(el => el.onclick = () => {
        State.selectedCatId = el.dataset.jumpCat;
        State.tab = 'places';
        renderAll();
      });
      main.querySelectorAll('[data-jump-status]').forEach(el => el.onclick = () => {
        State.filters.status = el.dataset.jumpStatus;
        State.tab = 'places';
        renderAll();
      });
      main.querySelectorAll('[data-jump-tag]').forEach(el => el.onclick = () => {
        State.filters.tags = [el.dataset.jumpTag];
        State.tab = 'places';
        renderAll();
      });
      main.querySelectorAll('[data-open-place]').forEach(el => el.onclick = () => openPlaceDetail(el.dataset.openPlace));
      const cSel = document.getElementById('stat-custom-select');
      if (cSel) cSel.onchange = (e) => { State.statsCustomFieldId = e.target.value; renderStatsView(); };
    }

    /* ==========================================================================
       12. RANDOM PICKER VIEW — "Where to today?" (§5.5)
       ========================================================================== */
    function renderRandomView() {
      const main = document.getElementById('main-view');
      const ro = State.randomOpts;
      const sortedCats = [...State.categories].sort((a, b) => a.order - b.order);

      const pool = State.places.filter(p => {
        if (ro.catId !== 'all' && p.categoryId !== ro.catId) return false;
        if (ro.onlyWant && p.status !== 'want') return false;
        if (ro.maxPrice > 0 && p.priceLevel > ro.maxPrice) return false;
        return true;
      });

      const pick = State.randomPick;

      main.innerHTML = `
        <div class="stat-card">
          <div class="form-group">
            <label class="form-label">Choose category</label>
            <select class="form-control" id="rnd-cat">
              <option value="all" ${ro.catId === 'all' ? 'selected' : ''}>All categories</option>
              ${sortedCats.map(c => `<option value="${esc(c.id)}" ${ro.catId === c.id ? 'selected' : ''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Max price level</label>
            <div class="chip-group">
              ${[[0, 'Any'], [1, '$'], [2, '$$'], [3, '$$$'], [4, '$$$$']].map(([val, lbl]) => `
                <button type="button" class="choice-chip ${ro.maxPrice === val ? 'selected' : ''}" data-rnd-price="${val}">${lbl}</button>`).join('')}
            </div>
          </div>

          <div class="form-group">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
              <input type="checkbox" id="rnd-only-want" ${ro.onlyWant ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--accent);">
              <span style="font-weight:600;">Only pick from "Want to go"</span>
            </label>
          </div>

          <button class="btn-primary" id="btn-roll-random" style="width:100%;height:48px;font-size:1.05rem;">
            🎲 Pick randomly (${pool.length} matching places)
          </button>
        </div>

        ${pick ? `
        <div class="stat-card" style="border:2px solid var(--accent);">
          <div style="font-size:0.82rem;color:var(--accent);font-weight:600;margin-bottom:4px;">TODAY'S PICK</div>
          <h2 style="margin:0 0 8px;">${esc(pick.name)}</h2>
          <div class="card-meta-row tabular-nums" style="margin-bottom:8px;">
            <span class="status-badge ${pick.status}">${pick.status === 'visited' ? 'Visited' : 'Want to go'}</span>
            ${pick.rating ? `<span class="rating-inline">★ ${pick.rating}</span>` : ''}
            ${pick.priceLevel ? `<span class="price-inline">${'$'.repeat(pick.priceLevel)}</span>` : ''}
          </div>
          ${pick.address ? `<div style="font-size:0.9rem;color:var(--text-muted);margin-bottom:10px;">📍 ${esc(pick.address)}</div>` : ''}
          ${pick.review ? `<div style="font-size:0.92rem;margin-bottom:12px;">${esc(pick.review)}</div>` : ''}
          <div style="display:flex;gap:10px;">
            <button class="btn-secondary" id="btn-rnd-again" style="flex:1;">Pick another</button>
            <button class="btn-primary" id="btn-rnd-detail" style="flex:1;">View details</button>
          </div>
        </div>` : ''}`;

      document.getElementById('rnd-cat').onchange = (e) => { ro.catId = e.target.value; State.randomPick = null; renderRandomView(); };
      document.getElementById('rnd-only-want').onchange = (e) => { ro.onlyWant = e.target.checked; State.randomPick = null; renderRandomView(); };
      main.querySelectorAll('[data-rnd-price]').forEach(b => b.onclick = () => {
        ro.maxPrice = parseInt(b.dataset.rndPrice, 10);
        State.randomPick = null;
        renderRandomView();
      });

      const roll = () => {
        if (pool.length === 0) {
          showToast('No places match the criteria!');
          return;
        }
        let candidates = pool.length > 1 && State.randomPick ? pool.filter(p => p.id !== State.randomPick.id) : pool;
        State.randomPick = candidates[Math.floor(Math.random() * candidates.length)];
        renderRandomView();
      };

      document.getElementById('btn-roll-random').onclick = roll;
      const againBtn = document.getElementById('btn-rnd-again');
      if (againBtn) againBtn.onclick = roll;
      const detBtn = document.getElementById('btn-rnd-detail');
      if (detBtn) detBtn.onclick = () => openPlaceDetail(pick.id);
    }

    /* ==========================================================================
       13. SETTINGS, CATEGORY & CUSTOM FIELD MANAGEMENT (§5.6, §5.7, §7)
       ========================================================================== */
    async function renderSettingsView() {
      const main = document.getElementById('main-view');
      const sortedCats = [...State.categories].sort((a, b) => a.order - b.order);

      let storageText = 'Calculating...';
      if (navigator.storage && navigator.storage.estimate) {
        try {
          const est = await navigator.storage.estimate();
          const usedMB = ((est.usage || 0) / (1024 * 1024)).toFixed(2);
          const quotaMB = ((est.quota || 0) / (1024 * 1024)).toFixed(0);
          storageText = `${usedMB} MB / ${quotaMB} MB`;
        } catch (_) {
          storageText = 'Unknown';
        }
      }

      main.innerHTML = `
        <div class="stat-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 class="stat-title" style="margin:0;">Manage Categories & Custom Fields</h3>
            <button class="btn-primary" id="btn-add-cat" style="min-height:36px;padding:0 12px;font-size:0.85rem;">+ Add</button>
          </div>
          <p style="font-size:0.84rem;color:var(--text-muted);margin:0 0 12px;">Tap a category to create or edit its custom fields.</p>
          <div id="settings-cat-list">
            ${sortedCats.map((c, idx) => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:6px;">
                <div style="flex:1;cursor:pointer;" data-manage-cat="${esc(c.id)}">
                  <div style="font-weight:600;">${esc(c.icon)} ${esc(c.name)}</div>
                  <div style="font-size:0.78rem;color:var(--text-muted);">${(c.fields || []).length} custom fields</div>
                </div>
                <div style="display:flex;gap:2px;">
                  <button class="icon-btn" data-cat-up="${idx}" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''} aria-label="Up">↑</button>
                  <button class="icon-btn" data-cat-down="${idx}" ${idx === sortedCats.length - 1 ? 'disabled style="opacity:0.3"' : ''} aria-label="Down">↓</button>
                  <button class="icon-btn" data-cat-edit="${esc(c.id)}" aria-label="Rename">✏️</button>
                  <button class="icon-btn" data-cat-del="${esc(c.id)}" aria-label="Delete" style="color:var(--danger);">🗑️</button>
                </div>
              </div>`).join('')}
          </div>
        </div>

        <div class="stat-card">
          <h3 class="stat-title">Appearance (Glacier theme)</h3>
          <div class="chip-group">
            ${[['auto', 'Auto (follow device)'], ['light', 'Light'], ['dark', 'Dark']].map(([k, lbl]) => `
              <button class="choice-chip ${(State.settings.theme || 'auto') === k ? 'selected' : ''}" data-theme-opt="${k}">${lbl}</button>`).join('')}
          </div>
        </div>

        <div class="stat-card">
          <h3 class="stat-title">Backup & Restore (Offline)</h3>
          <div class="tabular-nums" style="font-size:0.88rem;color:var(--text-muted);margin-bottom:12px;">
            <div>Storage used: <strong>${esc(storageText)}</strong></div>
            <div>Last backup: <strong>${State.settings.lastBackupAt ? esc(State.settings.lastBackupAt.slice(0, 16).replace('T', ' ')) : 'Never backed up'}</strong></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
            <button class="btn-primary" id="btn-export-json">⬇️ Export Backup (.json)</button>
            <button class="btn-secondary" id="btn-import-json">⬆️ Import Backup (.json)</button>
          </div>
          <button class="btn-secondary" id="btn-export-csv" style="width:100%;">📊 Export to Excel/Sheets (.csv, no photos)</button>
        </div>

        <div class="stat-card">
          <h3 class="stat-title">Sample Data & Reset</h3>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <button class="btn-secondary" id="btn-load-demo">✨ Load demo data (quick test)</button>
            <button class="btn-danger" id="btn-wipe-all">⚠️ Delete all data (2-step confirmation)</button>
          </div>
        </div>`;

      main.querySelectorAll('[data-theme-opt]').forEach(b => b.onclick = async () => {
        State.settings.theme = b.dataset.themeOpt;
        await DB.put('settings', State.settings);
        renderAll();
      });

      main.querySelectorAll('[data-manage-cat]').forEach(el => el.onclick = () => {
        openCategoryFieldsEditor(el.dataset.manageCat, () => renderSettingsView());
      });

      main.querySelectorAll('[data-cat-up]').forEach(b => b.onclick = async () => {
        const i = parseInt(b.dataset.catUp, 10);
        if (i <= 0) return;
        const tmp = sortedCats[i - 1].order;
        sortedCats[i - 1].order = sortedCats[i].order;
        sortedCats[i].order = tmp;
        await DB.put('categories', sortedCats[i - 1]);
        await DB.put('categories', sortedCats[i]);
        renderSettingsView();
      });

      main.querySelectorAll('[data-cat-down]').forEach(b => b.onclick = async () => {
        const i = parseInt(b.dataset.catDown, 10);
        if (i >= sortedCats.length - 1) return;
        const tmp = sortedCats[i + 1].order;
        sortedCats[i + 1].order = sortedCats[i].order;
        sortedCats[i].order = tmp;
        await DB.put('categories', sortedCats[i + 1]);
        await DB.put('categories', sortedCats[i]);
        renderSettingsView();
      });

      document.getElementById('btn-add-cat').onclick = () => openCatNameModal(null);
      main.querySelectorAll('[data-cat-edit]').forEach(b => b.onclick = () => {
        const cat = State.categories.find(c => c.id === b.dataset.catEdit);
        if (cat) openCatNameModal(cat);
      });
      main.querySelectorAll('[data-cat-del]').forEach(b => b.onclick = () => {
        const cat = State.categories.find(c => c.id === b.dataset.catDel);
        if (cat) openDeleteCategoryModal(cat);
      });

      document.getElementById('btn-export-json').onclick = exportBackupJson;
      document.getElementById('btn-import-json').onclick = () => document.getElementById('restore-file-input').click();
      document.getElementById('btn-export-csv').onclick = exportPlacesCsv;

      document.getElementById('btn-load-demo').onclick = async () => {
        const demos = getDemoPlaces();
        for (const dp of demos) {
          if (!State.places.some(p => p.id === dp.id)) {
            State.places.push(dp);
            await DB.put('places', dp);
          }
        }
        showToast('Demo data loaded!');
        State.tab = 'places';
        renderAll();
      };

      document.getElementById('btn-wipe-all').onclick = () => {
        openModal('Confirm delete: step 1/2', `
          <p>All <strong>${State.places.length} places</strong> and all photos will be deleted from this device.</p>
          <button class="btn-danger" id="btn-wipe-step2" style="width:100%;">I understand, continue to step 2</button>
        `, () => {
          document.getElementById('btn-wipe-step2').onclick = () => {
            openModal('Final confirmation 2/2', `
              <p>This can't be undone unless you've exported a backup.</p>
              <button class="btn-danger" id="btn-wipe-confirm-final" style="width:100%;">DELETE EVERYTHING PERMANENTLY</button>
            `, () => {
              document.getElementById('btn-wipe-confirm-final').onclick = async () => {
                await DB.clearStore('places');
                await DB.clearStore('photos');
                await DB.clearStore('categories');
                DB.revokeAllUrls();
                State.places = [];
                State.categories = getSeedCategories();
                for (const c of State.categories) await DB.put('categories', c);
                closeModal();
                renderAll();
                showToast('Everything deleted; default categories restored');
              };
            });
          };
        });
      };
    }

    function openCatNameModal(cat = null) {
      const isEdit = Boolean(cat);
      openModal(isEdit ? 'Edit category' : 'Add new category', `
        <div class="form-group">
          <label class="form-label">Icon (emoji)</label>
          <input class="form-control" id="m-cat-icon" value="${esc(cat ? cat.icon : '📍')}" maxlength="4">
        </div>
        <div class="form-group">
          <label class="form-label">Category name</label>

                    await DB.put('places', pl);

                }
                render();
              });

          });
        });
      };

      render();

/* ==========================================================================
       15. BACKUP / RESTORE (.ZIP STORE-ONLY, GARBAGE COLLECTOR & .CSV EXPORT) (§7)
       ========================================================================== */
    const CRC32_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })();

    function calcCrc32(u8) {
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < u8.length; i++) {
        crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ u8[i]) & 0xFF];
      }
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    // Scan and permanently delete every orphaned photo Blob that no longer belongs to any place
    async function garbageCollectPhotos() {
      try {
        const activeKeys = new Set();
        for (const p of State.places) {
          for (const ph of (p.photos || [])) {
            if (ph.blobKey) activeKeys.add(ph.blobKey);
            if (ph.thumbKey) activeKeys.add(ph.thumbKey);
          }
        }
        if (State.settings.draftPlace && Array.isArray(State.settings.draftPlace.photos)) {
          for (const ph of State.settings.draftPlace.photos) {
            if (ph.blobKey) activeKeys.add(ph.blobKey);
            if (ph.thumbKey) activeKeys.add(ph.thumbKey);
          }
        }

        const allStoredPhotos = await DB.getAll('photos');
        let removedCount = 0;
        for (const item of allStoredPhotos) {
          if (!activeKeys.has(item.key)) {
            await DB.delete('photos', item.key);
            DB.revokePhotoUrl(item.key);
            removedCount++;
          }
        }
        return removedCount;
      } catch (_) {
        return 0;
      }
    }

    // Pack a list of [{ name: string, blob: Blob }] into one .zip Blob (Method 0 - Store)
    async function buildStoreZipBlob(entries) {
      const enc = new TextEncoder();
      const fileChunks = [];
      const centralDirChunks = [];
      let offset = 0;

      for (const entry of entries) {
        const nameBytes = enc.encode(entry.name);
        const buf = await entry.blob.arrayBuffer();
        const u8 = new Uint8Array(buf);
        const crc = calcCrc32(u8);
        const size = u8.byteLength;

        const lfh = new ArrayBuffer(30 + nameBytes.length);
        const lfv = new DataView(lfh);
        lfv.setUint32(0, 0x04034b50, true);
        lfv.setUint16(4, 20, true);
        lfv.setUint16(6, 0x0800, true);
        lfv.setUint16(8, 0, true);
        lfv.setUint16(10, 0, true);
        lfv.setUint16(12, 0x21, true);
        lfv.setUint32(14, crc, true);
        lfv.setUint32(18, size, true);
        lfv.setUint32(22, size, true);
        lfv.setUint16(26, nameBytes.length, true);
        lfv.setUint16(28, 0, true);
        new Uint8Array(lfh, 30).set(nameBytes);

        const cdfh = new ArrayBuffer(46 + nameBytes.length);
        const cdv = new DataView(cdfh);
        cdv.setUint32(0, 0x02014b50, true);
        cdv.setUint16(4, 20, true);
        cdv.setUint16(6, 20, true);
        cdv.setUint16(8, 0x0800, true);
        cdv.setUint16(10, 0, true);
        cdv.setUint16(12, 0, true);
        cdv.setUint16(14, 0x21, true);
        cdv.setUint32(16, crc, true);
        cdv.setUint32(20, size, true);
        cdv.setUint32(24, size, true);
        cdv.setUint16(28, nameBytes.length, true);
        cdv.setUint16(30, 0, true);
        cdv.setUint16(32, 0, true);
        cdv.setUint16(34, 0, true);
        cdv.setUint16(36, 0, true);
        cdv.setUint32(38, 0, true);
        cdv.setUint32(42, offset, true);
        new Uint8Array(cdfh, 46).set(nameBytes);

        fileChunks.push(lfh, entry.blob);
        centralDirChunks.push(cdfh);
        offset += lfh.byteLength + size;
      }

      const cdSize = centralDirChunks.reduce((acc, c) => acc + c.byteLength, 0);
      const eocd = new ArrayBuffer(22);
      const eocdv = new DataView(eocd);
      eocdv.setUint32(0, 0x06054b50, true);
      eocdv.setUint16(4, 0, true);
      eocdv.setUint16(6, 0, true);
      eocdv.setUint16(8, entries.length, true);
      eocdv.setUint16(10, entries.length, true);
      eocdv.setUint32(12, cdSize, true);
      eocdv.setUint32(16, offset, true);
      eocdv.setUint16(20, 0, true);

      return new Blob([...fileChunks, ...centralDirChunks, eocd], { type: 'application/zip' });
    }

    // Read a .zip file (Store-only) and split it into Map<filename, Blob>
    async function parseStoreZipBlob(zipBlob) {
      const dec = new TextDecoder();
      const headBuf = await zipBlob.slice(0, 4).arrayBuffer();
      if (new DataView(headBuf).getUint32(0, true) !== 0x04034b50) {
        throw new Error('Not a valid ZIP file');
      }

      const tailLen = Math.min(zipBlob.size, 65557);
      const tailOffset = zipBlob.size - tailLen;
      const tailBuf = await zipBlob.slice(tailOffset, zipBlob.size).arrayBuffer();
      const tv = new DataView(tailBuf);

      let eocdPos = -1;
      for (let i = tailLen - 22; i >= 0; i--) {
        if (tv.getUint32(i, true) === 0x06054b50) {
          eocdPos = i;
          break;
        }
      }
      if (eocdPos === -1) throw new Error('ZIP directory structure (EOCD) not found');

      const totalEntries = tv.getUint16(eocdPos + 10, true);
      const cdSize = tv.getUint32(eocdPos + 12, true);
      const cdOffset = tv.getUint32(eocdPos + 16, true);

      const cdBuf = await zipBlob.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
      const cdv = new DataView(cdBuf);
      const cdU8 = new Uint8Array(cdBuf);

      const files = new Map();
      let ptr = 0;
      for (let i = 0; i < totalEntries; i++) {
        if (cdv.getUint32(ptr, true) !== 0x02014b50) break;
        const method = cdv.getUint16(ptr + 10, true);
        const compSize = cdv.getUint32(ptr + 20, true);
        const nameLen = cdv.getUint16(ptr + 28, true);
        const extraLen = cdv.getUint16(ptr + 30, true);
        const commentLen = cdv.getUint16(ptr + 32, true);
        const localHeaderOffset = cdv.getUint32(ptr + 42, true);

        const name = dec.decode(cdU8.subarray(ptr + 46, ptr + 46 + nameLen));
        ptr += 46 + nameLen + extraLen + commentLen;

        if (method !== 0) {
          throw new Error(`File "${name}" uses compression method ${method}; only ZIP Store-only archives from this app are supported.`);
        }

        const lfhBuf = await zipBlob.slice(localHeaderOffset, localHeaderOffset + 30).arrayBuffer();
        const lfhv = new DataView(lfhBuf);
        const lNameLen = lfhv.getUint16(26, true);
        const lExtraLen = lfhv.getUint16(28, true);
        const dataStart = localHeaderOffset + 30 + lNameLen + lExtraLen;

        const mime = name.endsWith('.json') ? 'application/json' : 'image/jpeg';
        files.set(name, zipBlob.slice(dataStart, dataStart + compSize, mime));
      }
      return files;
    }

    async function exportBackupJson() {
      await garbageCollectPhotos();
      showToast('Packing ZIP (metadata + photos)...', null, null, 2500);
      try {
        const photosRaw = await DB.getAll('photos');
        const nowIso = new Date().toISOString();
        State.settings.lastBackupAt = nowIso;
        await DB.put('settings', State.settings);

        const payload = {
          schemaVersion: SCHEMA_VERSION,
          exportedAt: nowIso,
          categories: State.categories,
          places: State.places,
          settings: State.settings,
          photoKeys: photosRaw.map(p => p.key)
        };

        const entries = [
          { name: 'data.json', blob: new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }) }
        ];

        for (const item of photosRaw) {
          if (item.key && item.blob) {
            entries.push({ name: `photos/${item.key}.jpg`, blob: item.blob });
          }
        }

        const zipBlob = await buildStoreZipBlob(entries);
        const ymd = nowIso.slice(0, 10).replace(/-/g, '');
        const fileName = `places-backup-${ymd}.zip`;

        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 8000);

        renderAll();
        showToast(`Exported ${fileName} (${photosRaw.length} photo files)`);
      } catch (err) {
        showToast('Backup packing error: ' + err.message);
      }
    }

    document.getElementById('restore-file-input').onchange = async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      try {
        let data = null;
        let zipPhotoMap = new Map();

        if (file.name.toLowerCase().endsWith('.zip') || file.type === 'application/zip') {
          const files = await parseStoreZipBlob(file);
          const dataBlob = files.get('data.json');
          if (!dataBlob) throw new Error('data.json not found inside the ZIP!');
          data = JSON.parse(await dataBlob.text());
          for (const [path, blob] of files.entries()) {
            if (path.startsWith('photos/') && path.endsWith('.jpg')) {
              const key = path.slice('photos/'.length, -4);
              zipPhotoMap.set(key, blob);
            }
          }
        } else {
          data = JSON.parse(await file.text());
        }

        if (!data || !Array.isArray(data.categories) || !Array.isArray(data.places)) {
          showToast('File is not a valid Places Backup!');
          return;
        }

        const totalPhotos = zipPhotoMap.size || (data.photos ? data.photos.length : 0);

        openModal('Restore Data (Import)', `
          <p>Backup contains: <strong>${data.categories.length} categories</strong>, <strong>${data.places.length} places</strong>, <strong>${totalPhotos} photo files</strong>.</p>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
            <button class="btn-primary" id="btn-imp-merge">🔄 Merge (by ID, keep existing data)</button>
            <button class="btn-danger" id="btn-imp-replace">⚠️ Replace everything (delete old data)</button>
          </div>
        `, () => {
          document.getElementById('btn-imp-merge').onclick = () => executeImport(data, zipPhotoMap, 'merge');
          document.getElementById('btn-imp-replace').onclick = () => executeImport(data, zipPhotoMap, 'replace');
        });
      } catch (err) {
        showToast('Error reading backup file: ' + err.message);
      }
    };

    async function executeImport(data, zipPhotoMap, mode) {
      closeModal();
      showToast('Restoring data...', null, null, 2000);

      if (mode === 'replace') {
        await DB.clearStore('categories');
        await DB.clearStore('places');
        await DB.clearStore('photos');
        DB.revokeAllUrls();
        State.categories = [];
        State.places = [];
      }

      const catMap = new Map(State.categories.map(c => [c.id, c]));
      for (const incCat of data.categories) {
        if (catMap.has(incCat.id) && mode === 'merge') {
          const curCat = catMap.get(incCat.id);
          const fMap = new Map((curCat.fields || []).map(f => [f.id, f]));
          for (const nf of (incCat.fields || [])) fMap.set(nf.id, nf);
          curCat.fields = Array.from(fMap.values());
          await DB.put('categories', curCat);
        } else {
          catMap.set(incCat.id, incCat);
          await DB.put('categories', incCat);
        }
      }
      State.categories = Array.from(catMap.values());

      const placeMap = new Map(State.places.map(p => [p.id, p]));
      for (const incPlace of data.places) {
        placeMap.set(incPlace.id, incPlace);
        await DB.put('places', incPlace);
      }
      State.places = Array.from(placeMap.values());

      let photoCount = 0;
      if (zipPhotoMap && zipPhotoMap.size > 0) {
        for (const [key, blob] of zipPhotoMap.entries()) {
          await DB.put('photos', { key, blob });
          photoCount++;
        }
      } else if (Array.isArray(data.photos)) {
        for (const ph of data.photos) {
          if (ph.key && ph.dataUrl) {
            const blob = await base64ToBlob(ph.dataUrl);
            await DB.put('photos', { key: ph.key, blob });
            photoCount++;
          }
        }
      }

      await garbageCollectPhotos();
      renderAll();
      showToast(`Done: ${State.categories.length} categories, ${State.places.length} places, ${photoCount} photos`);
    }

    // Export CSV including each category's custom field columns
    function exportPlacesCsv() {
      const sortedCats = [...State.categories].sort((a, b) => a.order - b.order);
      const catMap = new Map(sortedCats.map(c => [c.id, c]));

      const dynamicFields = [];
      for (const c of sortedCats) {
        const fields = [...(c.fields || [])].sort((a, b) => a.order - b.order);
        for (const fd of fields) {
          dynamicFields.push({
            catId: c.id,
            fieldId: fd.id,
            type: fd.type,
            headerName: `[${c.name}] ${fd.label}`
          });
        }
      }

      const baseHeaders = [
        'ID', 'Category', 'Name', 'Status', 'Favorite', 'Rating', 'Price',
        'Address', 'Maps link', 'Coordinates (Lat,Lng)', 'Opening hours', 'Tags',
        'Review', 'Last visited', 'Created', 'Updated'
      ];
      const headers = [...baseHeaders, ...dynamicFields.map(df => df.headerName)];
      const rows = [headers];

      for (const p of State.places) {
        const cat = catMap.get(p.categoryId);
        const coords = (p.lat !== null && p.lng !== null) ? `${p.lat}, ${p.lng}` : '';
        const baseRow = [
          p.id,
          cat ? cat.name : '',
          p.name || '',
          p.status === 'visited' ? 'Visited' : 'Want to go',
          p.favorite ? 'Yes' : 'No',
          p.rating ?? '',
          p.priceLevel ? '$'.repeat(p.priceLevel) : '',
          p.address || '',
          p.mapUrl || '',
          coords,
          p.hours || '',
          (p.tags || []).join('; '),
          (p.review || '').replace(/\r?\n/g, ' '),
          p.visitedAt || '',
          (p.createdAt || '').slice(0, 10),
          (p.updatedAt || '').slice(0, 10)
        ];

        const customRow = dynamicFields.map(df => {
          if (p.categoryId !== df.catId || !p.customValues) return '';
          const val = p.customValues[df.fieldId];
          if (val === undefined || val === null || val === '') return '';
          if (df.type === 'checkbox') return val ? 'Yes' : 'No';
          if (Array.isArray(val)) return val.join('; ');
          return String(val).replace(/\r?\n/g, ' ');
        });

        rows.push([...baseRow, ...customRow]);
      }

      const csvContent = '\uFEFF' + rows
        .map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `places-export-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /* ==========================================================================
       16. EVENT LISTENERS, MIGRATION & SERVICE WORKER BOOTSTRAP
       ========================================================================== */
    function bindGlobalEvents() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.onclick = () => {
          State.tab = btn.dataset.tab;
          renderAll();
        };
      });

      const searchWrap = document.getElementById('search-bar-wrap');
      const searchInput = document.getElementById('search-input');
      document.getElementById('btn-toggle-search').onclick = () => {
        const isOpen = searchWrap.classList.toggle('open');
        if (isOpen) searchInput.focus();
      };
      searchInput.oninput = (e) => {
        State.searchQuery = e.target.value;
        renderPlacesView();
      };
      document.getElementById('btn-clear-search').onclick = () => {
        State.searchQuery = '';
        searchInput.value = '';
        searchWrap.classList.remove('open');
        renderPlacesView();
      };

      document.getElementById('btn-open-filter').onclick = openFilterModal;

      document.getElementById('btn-toggle-cols').onclick = async () => {
        State.settings.gridCols = State.settings.gridCols === 2 ? 1 : 2;
        await DB.put('settings', State.settings);
        renderPlacesView();
      };

      document.getElementById('btn-fab-add').onclick = () => openPlaceForm(null);
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      try {
        navigator.serviceWorker.register('sw.js').then(reg => {
          const promptUpdate = (worker) => {
            showToast('Update available', 'Update', () => {
              worker.postMessage({ type: 'SKIP_WAITING' });
            }, 0);
          };

          if (reg.waiting && navigator.serviceWorker.controller) {
            promptUpdate(reg.waiting);
          }

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                promptUpdate(newWorker);
              }
            });
          });
        }).catch(() => {});

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      } catch (_) {}
    }

    async function bootstrap() {
      bindGlobalEvents();
      registerServiceWorker();

      if (navigator.storage && navigator.storage.persist) {
        try { navigator.storage.persist(); } catch (_) {}
      }

      try {
        await DB.init();
        const savedSettings = await DB.get('settings', 'app_settings');
        if (savedSettings) {
          State.settings = { ...State.settings, ...savedSettings, schemaVersion: SCHEMA_VERSION };
        } else {
          await DB.put('settings', State.settings);
        }

        State.categories = await DB.getAll('categories');
        if (State.categories.length === 0) {
          State.categories = getSeedCategories();
          for (const c of State.categories) await DB.put('categories', c);
        }

        State.places = await DB.getAll('places');
        await garbageCollectPhotos();
        renderAll();
      } catch (err) {
        document.getElementById('main-view').innerHTML = `
          <div class="stat-card" style="border-color:var(--danger);">
            <h3 style="color:var(--danger);margin-top:0;">⚠️ Browser storage unavailable</h3>
            <p>Could not initialize IndexedDB (${esc(err.message)}). Turn off private browsing or check free storage on your device.</p>
          </div>`;
      }
    }

    bootstrap();
  </script>
