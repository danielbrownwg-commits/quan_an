<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F7FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1821" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Places — Place Journal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tall-phone.css">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="top-header" id="main-header">
      <div class="header-row">
        <h1 class="app-title" id="header-title">Places</h1>
        <div class="header-actions" id="header-home-actions">
          <button class="icon-btn" id="btn-toggle-search" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="icon-btn" id="btn-open-filter" aria-label="Filters">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/><circle cx="6" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>
            <span class="badge-dot" id="filter-active-dot" style="display:none"></span>
          </button>
          <button class="icon-btn" id="btn-toggle-cols" aria-label="Change grid layout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>

      <!-- Collapsible Search Bar -->
      <div class="search-bar-wrap" id="search-bar-wrap">
        <div class="search-input-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" placeholder="Search name, dish, address, tag...">
          <button class="icon-btn" id="btn-clear-search" aria-label="Clear search" style="width:32px;height:32px;min-width:32px;min-height:32px;">✕</button>
        </div>
      </div>

      <!-- Category Horizontal Chips -->
      <div class="cat-scroll" id="cat-bar"></div>
    </header>

    <!-- Backup Banner (> 14 days) -->
    <div id="backup-reminder-wrap"></div>

    <!-- Active Filter Pills -->
    <div id="active-filters-wrap"></div>

    <!-- Main View Content -->
    <main class="view-container" id="main-view"></main>

    <!-- Floating Action Button (+) -->
    <button class="fab-add" id="btn-fab-add" aria-label="Add new place">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="places" aria-label="Places">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>Places</span>
      </button>
      <button class="nav-item" data-tab="stats" aria-label="Stats">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Stats</span>
      </button>
      <button class="nav-item" data-tab="random" aria-label="Random">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        <span>Pick for me</span>
      </button>
      <button class="nav-item" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.41 1.09H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Full-Screen Overlay Sheet (Detail / Place Form / Category Field Editor) -->
  <section class="overlay-sheet" id="overlay-sheet" aria-hidden="true"></section>

  <!-- Reusable Bottom Sheet Modal (Filters, Quick Actions, Confirmations) -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="bottom-modal" role="dialog" aria-modal="true">
      <div class="bottom-modal-header">
        <span id="modal-title">Options</span>
        <button class="icon-btn" id="btn-close-modal" aria-label="Close">✕</button>
      </div>
      <div class="bottom-modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- Fullscreen Photo Lightbox -->
  <div class="lightbox" id="lightbox">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span id="lightbox-meta" style="font-size:0.9rem;"></span>
      <button class="icon-btn" id="btn-close-lightbox" aria-label="Close photo" style="color:#fff;">✕</button>
    </div>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div id="lightbox-caption" style="text-align:center;font-size:0.95rem;"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Hidden file inputs for Restore -->
  <input type="file" id="restore-file-input" accept=".zip,.json,application/zip,application/json" style="display:none">

  <script type="module" src="js/main.js"></script>
</body>
</html>
