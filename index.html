:root {
  --font-serif: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
html { font-family: var(--font-serif); font-weight: 400; -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; }

      --radius-sm: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0D1821;
        --surface: #15232F;
        --surface-2: #1D2E3C;
        --border: #2A3D4D;
        --text: #E6EEF4;
        --text-muted: #8EA3B3;
        --accent: #7CC6F2;
        --accent-soft: #1B3C52;
        --star: #9AD6FA;
        --danger: #F09A8A;
        --danger-soft: #3D1F1A;
        --success: #68C49B;
        --shadow: none;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0D1821;
      --surface: #15232F;
      --surface-2: #1D2E3C;
      --border: #2A3D4D;
      --text: #E6EEF4;
      --text-muted: #8EA3B3;
      --accent: #7CC6F2;
      --accent-soft: #1B3C52;
      --star: #9AD6FA;
      --danger: #F09A8A;
      --danger-soft: #3D1F1A;
      --success: #68C49B;
      --shadow: none;
    }

    /* ==========================================================================
       3. RESET & BASE STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 16px; /* Prevents iOS/Android auto-zoom on focus */
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }

    button {
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--radius-sm);
      transition: opacity 0.15s, background-color 0.15s;
    }

    button:active {
      opacity: 0.75;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       4. APP SHELL & LAYOUT
       ========================================================================== */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      padding-top: var(--safe-top);
      padding-bottom: calc(68px + var(--safe-bottom));
      position: relative;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: var(--text);
      position: relative;
    }

    .icon-btn.active {
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .badge-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    /* Search Bar Collapsible */
    .search-bar-wrap {
      margin-top: 8px;
      display: none;
    }
    .search-bar-wrap.open {
      display: flex;
      gap: 8px;
    }
    .search-input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 10px;
    }
    .search-input-box input {
      width: 100%;
      height: 42px;
      padding: 0 8px;
    }

    /* Category Horizontal Scroll */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 2px;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar {
      display: none;
    }
    .cat-chip {
      flex-shrink: 0;
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.92rem;
      white-space: nowrap;
      color: var(--text-muted);
    }
    .cat-chip.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }
    .cat-chip .count {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-left: 2px;
    }

    /* Active Filter Chips Bar */
    .active-filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 14px 0;
      align-items: center;
    }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
      min-height: 32px;
    }
    .clear-filters-btn {
      font-size: 0.85rem;
      color: var(--danger);
      min-height: 32px;
      padding: 0 8px;
    }

    /* Backup reminder banner */
    .backup-banner {
      margin: 10px 14px 0;
      padding: 10px 12px;
      background-color: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.9rem;
    }

    /* Main Content Container */
    .view-container {
      flex: 1;
      padding: 12px 14px 24px;
    }

    /* ==========================================================================
       5. PLACE CARDS & GRID
       ========================================================================== */
    .places-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .places-list.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .place-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: row;
      position: relative;
      content-visibility: auto;
      contain-intrinsic-size: 130px;
      cursor: pointer;
    }

    .places-list.cols-2 .place-card {
      flex-direction: column;
      contain-intrinsic-size: 220px;
    }

    .card-thumb {
      width: 112px;
      min-height: 120px;
      background-color: var(--surface-2);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      position: relative;
      overflow: hidden;
    }

    .places-list.cols-2 .card-thumb {
      width: 100%;
      height: 120px;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-fav-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(13, 24, 33, 0.65);
      color: #FF7B72;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .card-body {
      flex: 1;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .card-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-more-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      margin: -4px -6px 0 0;
      color: var(--text-muted);
      border-radius: 50%;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
    }

    .status-badge {
      padding: 1px 7px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-badge.visited {
      background-color: var(--accent-soft);
      color: var(--accent);
    }
    .status-badge.want {
      background-color: var(--surface-2);
      color: var(--text-muted);
    }

    .rating-inline {
      color: var(--star);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .price-inline {
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-custom-row {
      font-size: 0.83rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-custom-row span.lbl {
      color: var(--text-muted);
    }

    .card-address {
      font-size: 0.83rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tag-chip {
      font-size: 0.75rem;
      padding: 1px 6px;
      border-radius: 4px;
      background-color: var(--surface-2);
      color: var(--text-muted);
    }

    mark.hl {
      background-color: var(--accent-soft);
      color: var(--accent);
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .btn-primary {
      background-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
      padding: 0 18px;
      border-radius: var(--radius-sm);
    }
    .btn-secondary {
      background-color: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0 14px;
      border-radius: var(--radius-sm);
    }
    .btn-danger {
      background-color: var(--danger);
      color: #fff;
      font-weight: 600;
      padding: 0 16px;
      border-radius: var(--radius-sm);
    }

    /* ==========================================================================
       6. BOTTOM TAB BAR & FAB
       ========================================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
      display: flex;
      justify-content: space-around;
      max-width: 600px;
      margin: 0 auto;
    }

    .nav-item {
      flex: 1;
      height: 58px;
      flex-direction: column;
      gap: 2px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-radius: 0;
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: 600;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
    }

    .fab-add {
      position: fixed;
      right: max(16px, calc((100vw - 600px) / 2 + 16px));
      bottom: calc(74px + var(--safe-bottom));
      z-index: 25;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--accent);
      color: var(--bg);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }

    /* ==========================================================================
       7. FULL-SCREEN SHEETS & MODALS (Detail, Form, Filter, Field Manager)
       ========================================================================== */
    .overlay-sheet {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: var(--bg);
      display: none;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow-y: auto;
    }
    .overlay-sheet.open {
      display: flex;
    }

    .sheet-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sheet-title {
      font-weight: 600;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sheet-body {
      padding: 16px 14px 90px;
      flex: 1;
    }

    .sheet-footer-fixed {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(10px + var(--safe-bottom));
      display: flex;
      gap: 10px;
    }

    /* Bottom Sheet Backdrop Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background-color: rgba(10, 18, 26, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .bottom-modal {
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      background-color: var(--surface);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-bottom);
      overflow: hidden;
    }
    .bottom-modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }
    .bottom-modal-content {
      padding: 14px 16px 20px;
      overflow-y: auto;
    }

    /* ==========================================================================
       8. DETAIL PAGE COMPONENTS
       ========================================================================== */
    .carousel-wrap {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      margin: -16px -14px 16px;
      padding: 12px 14px;
      background-color: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .carousel-item {
      flex: 0 0 85%;
      max-width: 340px;
      height: 220px;
      scroll-snap-align: center;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      background-color: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(13, 24, 33, 0.75);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .photo-caption-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 24, 33, 0.7);
      color: #fff;
      font-size: 0.8rem;
      padding: 4px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Notion-style Properties Table */
    .props-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .props-row {
      display: grid;
      grid-template-columns: 38% 62%;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    .props-row:last-child {
      border-bottom: none;
    }
    .props-label {
      padding: 10px 12px;
      color: var(--text-muted);
      background-color: var(--surface-2);
      font-weight: 600;
      word-break: break-word;
    }
    .props-val {
      padding: 10px 12px;
      word-break: break-word;
    }
    .props-val a {
      color: var(--accent);
      text-decoration: underline;
    }

    .detail-review-box {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      white-space: pre-wrap;
      margin: 14px 0;
    }

    /* Interactive Half-Star Widget */
    .star-picker {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      user-select: none;
    }
    .star-unit {
      position: relative;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .star-unit svg {
      width: 26px;
      height: 26px;
    }
    .star-half-left, .star-half-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 2;
    }
    .star-half-left { left: 0; }
    .star-half-right { right: 0; }

    /* ==========================================================================
       9. FORMS & INPUTS
       ========================================================================== */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
    }
    textarea.form-control {
      min-height: 96px;
      resize: vertical;
    }
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .choice-chip {
      padding: 6px 12px;
      min-height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      font-size: 0.9rem;
    }
    .choice-chip.selected {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }

    .photo-edit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .photo-edit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .photo-edit-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
    }

    /* ==========================================================================
       10. STATS & RANDOM VIEWS
       ========================================================================== */
    .stat-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .stat-title {
      font-weight: 600;
      margin: 0 0 10px;
      font-size: 1rem;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .bar-label {
      width: 110px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 12px;
      background-color: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background-color: var(--accent);
      border-radius: 999px;
    }
    .bar-val {
      width: 36px;
      text-align: right;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(10px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));
      color: #fff;
    }
    .lightbox.open {
      display: flex;
    }
    .lightbox-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      touch-action: pinch-zoom;
    }
    .lightbox-img-wrap img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    /* Toast & Update Notification */
    #toast-container {
      position: fixed;
      bottom: calc(74px + var(--safe-bottom));
      left: 14px;
      right: 14px;
      max-width: 572px;
      margin: 0 auto;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background-color: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: auto;
      font-size: 0.92rem;
    }
    .toast button {
      color: var(--accent-soft);
      font-weight: 600;
      min-height: 34px;
      padding: 0 10px;
      background: rgba(255,255,255,0.12);
    }

    /* ==========================================================================
       7. TALL & NARROW PHONE TWEAKS (about 400 x 870 CSS px)

  <script>
    /* ==========================================================================
       1. UTILITIES & VIETNAMESE NORMALIZATION
       ========================================================================== */
    const SCHEMA_VERSION = 1;
    const DB_NAME = 'places_glacier_db';
    const DB_VERSION = 1;

    const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

    // Normalize: case-insensitive and strip Vietnamese diacritics
    function vnNorm(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'd')
        .toLowerCase()
        .trim();
    }

    // Strict XSS escaping before rendering
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Highlight text matching the diacritic-free keyword
    function highlightMatch(text, rawQuery) {
      if (!text) return '';
      const q = vnNorm(rawQuery);
      if (!q) return esc(text);
      const chars = Array.from(String(text));
      const normChars = chars.map(c => vnNorm(c));
      const normJoined = normChars.join('');
      const idx = normJoined.indexOf(q);
      if (idx === -1) return esc(text);
      const before = chars.slice(0, idx).join('');
      const match = chars.slice(idx, idx + q.length).join('');
      const after = chars.slice(idx + q.length).join('');
      return `${esc(before)}<mark class="hl">${esc(match)}</mark>${esc(after)}`;
    }

    // Parse name & coordinates from a Google Maps URL (offline regex)
    function parseGoogleMapsUrl(url) {
      if (!url) return { lat: null, lng: null, name: '' };
      let lat = null, lng = null, name = '';
      const atMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      const qMatch = url.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
      const dMatch = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
      const coord = dMatch || atMatch || qMatch;
      if (coord) {
        lat = parseFloat(coord[1]);
        lng = parseFloat(coord[2]);
      }
      const placeMatch = url.match(/\/place\/([^/@?]+)/);
      if (placeMatch && placeMatch[1]) {
        try {
          name = decodeURIComponent(placeMatch[1].replace(/\+/g, ' '));
        } catch (_) {}
      }
      return { lat, lng, name };
    }

    /* ==========================================================================

    function getDemoPlaces() {
      const now = new Date().toISOString();
      return [
        {
          id: 'p_demo_1', categoryId: 'cat_food', name: 'Bánh cuốn Bà Hoành', status: 'visited',

          address: '66 Tô Hiến Thành, Hai Bà Trưng, Hà Nội', mapUrl: 'https://www.google.com/maps/place/B%C3%A1nh+Cu%E1%BB%91n+B%C3%A0+Ho%C3%A0nh/@21.0145,105.8492',
          lat: 21.0145, lng: 105.8492, hours: '06:00–20:00', priceLevel: 1,
          tags: ['banh cuon', 'breakfast', 'traditional'], photos: [], visitedAt: now.slice(0, 10),

        },

          lat: null, lng: null, hours: '08:00–22:30', priceLevel: 2,

    /* ==========================================================================
       3. INDEXEDDB STORAGE ENGINE & OBJECT URL MANAGER
       ========================================================================== */
    const DB = {
      db: null,
      blobUrls: new Map(), // key -> objectURL

      async init() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('This browser does not support IndexedDB.'));
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('categories')) db.createObjectStore('categories', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('places')) db.createObjectStore('places', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'key' });
            if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve();
          };
          req.onerror = () => reject(req.error);
        });
      },

      async getAll(storeName) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      },

      async get(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },

      async put(storeName, item) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(item);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },

      async delete(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).delete(key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },

      async clearStore(storeName) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      },

      async getPhotoUrl(blobKey) {
        if (!blobKey) return null;
        if (this.blobUrls.has(blobKey)) return this.blobUrls.get(blobKey);
        const rec = await this.get('photos', blobKey);
        if (!rec || !rec.blob) return null;
        const url = URL.createObjectURL(rec.blob);
        this.blobUrls.set(blobKey, url);
        return url;
      },

      revokePhotoUrl(blobKey) {
        if (this.blobUrls.has(blobKey)) {
          URL.revokeObjectURL(this.blobUrls.get(blobKey));
          this.blobUrls.delete(blobKey);
        }
      },

      revokeAllUrls() {
        for (const url of this.blobUrls.values()) URL.revokeObjectURL(url);
        this.blobUrls.clear();
      }
    };

    /* ==========================================================================
       4. IMAGE COMPRESSION (Canvas 1600px full + 400px thumb)
       ========================================================================== */
    async function compressImageFile(file) {
      const bitmap = await createImageBitmap(file);
      const makeBlob = async (maxSide, quality) => {
        let { width, height } = bitmap;
        if (width > maxSide || height > maxSide) {
          if (width >= height) {
            height = Math.round((height * maxSide) / width);
            width = maxSide;
          } else {
            width = Math.round((width * maxSide) / height);
            height = maxSide;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, width, height);
        return new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
      };
      const fullBlob = await makeBlob(1600, 0.8);
      const thumbBlob = await makeBlob(400, 0.78);
      if (bitmap.close) bitmap.close();
      return { fullBlob, thumbBlob };
    }

    function blobToBase64(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    async function base64ToBlob(dataUrl) {
      const res = await fetch(dataUrl);
      return await res.blob();
    }

    /* ==========================================================================
       5. APPLICATION STATE & FILTER LOGIC
       ========================================================================== */
    const State = {
      tab: 'places',          // 'places' | 'stats' | 'random' | 'settings'
      categories: [],
      places: [],
      settings: {
        key: 'app_settings',
        schemaVersion: SCHEMA_VERSION,
        theme: 'auto',
        lastBackupAt: null,
        gridCols: 1,
        draftPlace: null
      },
      selectedCatId: 'all',
      searchQuery: '',
      filters: {
        status: 'all',        // 'all' | 'visited' | 'want'
        minRating: 0,         // 0 | 3 | 4 | 4.5 | -1 (unrated)
        prices: [],           // [1,2,3,4]
        tags: [],
        onlyFav: false,
        custom: {},           // { [fieldId]: value }
        sortBy: 'newest'      // 'newest' | 'rating' | 'name' | 'visited'
      },
      randomPick: null,
      randomOpts: { catId: 'all', onlyWant: true, maxPrice: 0 },
      statsCustomFieldId: ''
    };

    function resetCustomFilters() {
      State.filters.custom = {};
    }

    function hasActiveFilters() {
      const f = State.filters;
      return (
        f.status !== 'all' ||
        f.minRating !== 0 ||
        f.prices.length > 0 ||
        f.tags.length > 0 ||
        f.onlyFav ||
        Object.keys(f.custom).length > 0
      );
    }

    function getFilteredPlaces() {
      const q = vnNorm(State.searchQuery);
      const f = State.filters;
      const catMap = new Map(State.categories.map(c => [c.id, c]));

      let list = State.places.filter(p => {
        if (State.selectedCatId !== 'all' && p.categoryId !== State.selectedCatId) return false;
        if (f.status !== 'all' && p.status !== f.status) return false;
        if (f.onlyFav && !p.favorite) return false;

        if (f.minRating === -1) {
          if (p.rating !== null) return false;
        } else if (f.minRating > 0) {
          if ((p.rating || 0) < f.minRating) return false;
        }

        if (f.prices.length > 0 && !f.prices.includes(p.priceLevel)) return false;
        if (f.tags.length > 0 && !f.tags.every(t => (p.tags || []).includes(t))) return false;

        // Filter by CustomField (only when a specific category is selected)
        if (State.selectedCatId !== 'all') {
          const cat = catMap.get(p.categoryId);
          if (cat) {
            for (const [fId, fVal] of Object.entries(f.custom)) {
              const fieldDef = cat.fields.find(fd => fd.id === fId);
              if (!fieldDef) continue;
              const pVal = p.customValues ? p.customValues[fId] : undefined;
              if (fieldDef.type === 'select' && Array.isArray(fVal) && fVal.length > 0) {
                if (!fVal.includes(pVal)) return false;
              } else if (fieldDef.type === 'multiselect' && Array.isArray(fVal) && fVal.length > 0) {
                if (!Array.isArray(pVal) || !fVal.some(v => pVal.includes(v))) return false;
              } else if (fieldDef.type === 'checkbox' && fVal !== 'all') {
                const boolVal = Boolean(pVal);
                if (fVal === 'yes' && !boolVal) return false;
                if (fVal === 'no' && boolVal) return false;
              } else if (fieldDef.type === 'number' && fVal) {
                const num = parseFloat(pVal);
                if (fVal.min !== '' && (isNaN(num) || num < parseFloat(fVal.min))) return false;
                if (fVal.max !== '' && (isNaN(num) || num > parseFloat(fVal.max))) return false;
              }
            }
          }
        }

        // Diacritic-free text search on name + review + address + tags + custom text/longtext/url
        if (q) {
          const cat = catMap.get(p.categoryId);
          let customText = '';
          if (cat && p.customValues) {
            for (const fd of cat.fields) {
              if (['text', 'longtext', 'url'].includes(fd.type) && p.customValues[fd.id]) {
                customText += ' ' + p.customValues[fd.id];
              }
            }
          }
          const haystack = vnNorm(`${p.name} ${p.review} ${p.address} ${(p.tags || []).join(' ')} ${customText}`);
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      // Sorting (favorites pinned first within the same group, otherwise standard sort)
      list.sort((a, b) => {
        if (a.favorite !== b.favorite) return a.favorite ? -1 : 1;
        if (f.sortBy === 'rating') return (b.rating || -1) - (a.rating || -1);
        if (f.sortBy === 'name') return a.name.localeCompare(b.name, 'vi');
        if (f.sortBy === 'visited') return (b.visitedAt || '').localeCompare(a.visitedAt || '');
        return (b.createdAt || '').localeCompare(a.createdAt || '');
      });

      return list;
    }

    /* ==========================================================================
       6. UI HELPERS: TOAST, MODAL, STARS SVG
       ========================================================================== */
    function showToast(msg, actionLabel = null, onAction = null, duration = 4500) {
      const wrap = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span>${esc(msg)}</span>`;
      if (actionLabel && onAction) {
        const btn = document.createElement('button');
        btn.textContent = actionLabel;
        btn.onclick = () => {
          onAction();
          el.remove();
        };
        el.appendChild(btn);
      }
      wrap.appendChild(el);
      if (duration > 0) {
        setTimeout(() => { if (el.parentNode) el.remove(); }, duration);
      }
    }

    function openModal(title, htmlContent, onMount) {
      document.getElementById('modal-title').textContent = title;
      const box = document.getElementById('modal-content');
      box.innerHTML = htmlContent;
      document.getElementById('modal-backdrop').classList.add('open');
      if (onMount) onMount(box);
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    document.getElementById('btn-close-modal').onclick = closeModal;
    document.getElementById('modal-backdrop').onclick = (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    };

    // Draw the 5-star strip with half-star support (0.5 step)
    function renderHalfStarPicker(currentVal, inputId) {
      const val = parseFloat(currentVal) || 0;
      let html = `<div class="star-picker" data-star-picker="${esc(inputId)}">`;
      for (let i = 1; i <= 5; i++) {
        let fillType = 'empty';
        if (val >= i) fillType = 'full';
        else if (val >= i - 0.5) fillType = 'half';
        const gradId = `grad_${inputId}_${i}`;
        html += `
          <div class="star-unit" data-star-idx="${i}">
            <div class="star-half-left" data-val="${i - 0.5}"></div>
            <div class="star-half-right" data-val="${i}"></div>
            <svg viewBox="0 0 24 24">
              <defs>
                <linearGradient id="${gradId}">
                  <stop offset="50%" stop-color="var(--star)"/>
                  <stop offset="50%" stop-color="transparent"/>
                </linearGradient>
              </defs>
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                stroke="var(--star)" stroke-width="1.8"
                fill="${fillType === 'full' ? 'var(--star)' : fillType === 'half' ? `url(#${gradId})` : 'none'}" />
            </svg>
          </div>`;
      }
      html += `
        <button type="button" class="btn-secondary" data-clear-star="1" style="min-height:30px;padding:0 8px;font-size:0.8rem;margin-left:6px;">Clear</button>
        <span class="tabular-nums" style="margin-left:6px;font-weight:600;color:var(--star);" data-star-label>${val > 0 ? val : 'Unrated'}</span>
      </div>`;
      return html;
    }

    function bindStarPicker(container, initialVal, onChange) {
      let current = initialVal;
      const rerender = () => {
        container.innerHTML = renderHalfStarPicker(current, uid());
        container.querySelectorAll('[data-val]').forEach(half => {
          half.onclick = () => {
            current = parseFloat(half.dataset.val);
            onChange(current);
            rerender();
          };
        });
        const clearBtn = container.querySelector('[data-clear-star]');
        if (clearBtn) {
          clearBtn.onclick = () => {
            current = null;
            onChange(null);
            rerender();
          };
        }
      };
      rerender();
    }

    /* ==========================================================================
       7. MAIN RENDERERS (Header, Category Bar, Places List)

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', State.settings.theme || 'auto');
    }

    function renderAll() {
      applyTheme();
      renderHeader();
      renderBackupBanner();
      renderActiveFiltersBar();

      const fab = document.getElementById('btn-fab-add');
      fab.style.display = State.tab === 'places' ? 'inline-flex' : 'none';

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === State.tab);
      });

      else if (State.tab === 'stats') renderStatsView();
      else if (State.tab === 'random') renderRandomView();
      else if (State.tab === 'settings') renderSettingsView();

    function renderHeader() {
      const titleEl = document.getElementById('header-title');
      const homeActions = document.getElementById('header-home-actions');
      const catBar = document.getElementById('cat-bar');
      const searchWrap = document.getElementById('search-bar-wrap');

      if (State.tab !== 'places') {
        homeActions.style.display = 'none';
        catBar.style.display = 'none';
        searchWrap.classList.remove('open');
        const titles = { stats: 'Stats', random: 'Where to today?', settings: 'Settings & Data' };
        titleEl.textContent = titles[State.tab] || 'Places';
        return;
      }

      titleEl.textContent = 'Places';
      homeActions.style.display = 'flex';
      catBar.style.display = 'flex';
      document.getElementById('filter-active-dot').style.display = hasActiveFilters() ? 'block' : 'none';

      const counts = { all: State.places.length };
      for (const p of State.places) counts[p.categoryId] = (counts[p.categoryId] || 0) + 1;

      const sortedCats = [...State.categories].sort((a, b) => a.order - b.order);
      let html = `<button class="cat-chip ${State.selectedCatId === 'all' ? 'active' : ''}" data-cat="all">
        All <span class="count tabular-nums">(${counts.all})</span>
      </button>`;

      for (const c of sortedCats) {
        const cnt = counts[c.id] || 0;
        html += `<button class="cat-chip ${State.selectedCatId === c.id ? 'active' : ''}" data-cat="${esc(c.id)}">
          ${esc(c.icon)} ${esc(c.name)} <span class="count tabular-nums">(${cnt})</span>
        </button>`;
      }
      catBar.innerHTML = html;
      catBar.querySelectorAll('.cat-chip').forEach(btn => {
        btn.onclick = () => {
          State.selectedCatId = btn.dataset.cat;
          resetCustomFilters();
          renderAll();
        };
      });
    }

    function renderBackupBanner() {
      const wrap = document.getElementById('backup-reminder-wrap');
      if (State.tab !== 'places' || State.places.length === 0) {
        wrap.innerHTML = '';
        return;
      }
      const last = State.settings.lastBackupAt ? new Date(State.settings.lastBackupAt).getTime() : 0;
      const days = (Date.now() - last) / (1000 * 3600 * 24);
      if (days > 14) {
        wrap.innerHTML = `
          <div class="backup-banner">
            <span>⚠️ It's been over 14 days since your last backup.</span>
            <button class="btn-primary" id="btn-quick-backup" style="min-height:34px;padding:0 12px;font-size:0.85rem;">Back up now</button>
          </div>`;
        document.getElementById('btn-quick-backup').onclick = exportBackupJson;
      } else {
        wrap.innerHTML = '';
      }
    }

    function renderActiveFiltersBar() {
      const wrap = document.getElementById('active-filters-wrap');
      if (State.tab !== 'places' || !hasActiveFilters()) {
        wrap.innerHTML = '';
        return;
      }
      const f = State.filters;
      const pills = [];
      if (f.status !== 'all') pills.push(f.status === 'visited' ? 'Visited' : 'Want to go');
      if (f.minRating === -1) pills.push('Unrated');
      else if (f.minRating > 0) pills.push(`≥ ${f.minRating}★`);
      if (f.prices.length) pills.push(f.prices.map(p => '$'.repeat(p)).join(', '));
      if (f.onlyFav) pills.push('♥ Favorite');
      f.tags.forEach(t => pills.push(`#${t}`));

      for (const [k, v] of Object.entries(f.custom)) {
        if (Array.isArray(v) && v.length) pills.push(v.join(', '));
        else if (typeof v === 'string' && v !== 'all') pills.push(`${k}: ${v}`);
        else if (typeof v === 'object' && (v.min || v.max)) pills.push(`${v.min || 0}–${v.max || '∞'}`);
      }

      wrap.innerHTML = `
        <div class="active-filters-bar">
          ${pills.map(p => `<span class="filter-pill">${esc(p)}</span>`).join('')}
          <button class="clear-filters-btn" id="btn-clear-all-filters">Clear filters</button>
        </div>`;
      document.getElementById('btn-clear-all-filters').onclick = () => {
        State.filters = { status: 'all', minRating: 0, prices: [], tags: [], onlyFav: false, custom: {}, sortBy: State.filters.sortBy };
        renderAll();
      };
    }

    async function renderPlacesView() {
      const main = document.getElementById('main-view');
      const places = getFilteredPlaces();
      const catMap = new Map(State.categories.map(c => [c.id, c]));

      if (places.length === 0) {
        main.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🧭</div>
            <p style="font-size:1.05rem;font-weight:600;color:var(--text);">No matching places</p>
            <p style="font-size:0.9rem;margin-bottom:18px;">Save your regular spots or places you want to visit soon.</p>
            <button class="btn-primary" id="btn-empty-add">+ Add your first place</button>
          </div>`;
        document.getElementById('btn-empty-add').onclick = () => openPlaceForm(null);
        return;
      }

      const listEl = document.createElement('div');
      listEl.className = `places-list ${State.settings.gridCols === 2 ? 'cols-2' : ''}`;

      for (const p of places) {
        const cat = catMap.get(p.categoryId) || { icon: '📍', name: 'Other', fields: [] };
        const card = document.createElement('article');
        card.className = 'place-card';

        // Custom fields shown on the card (max 2 fields with showOnCard: true)
        const cardFields = (cat.fields || []).filter(fd => fd.showOnCard).slice(0, 2);
        let customHtml = '';
        for (const fd of cardFields) {
          const val = p.customValues ? p.customValues[fd.id] : undefined;
          if (val !== undefined && val !== '' && val !== null && !(Array.isArray(val) && val.length === 0)) {
            const disp = fd.type === 'checkbox' ? (val ? 'Yes' : 'No') : Array.isArray(val) ? val.join(', ') : val;
            customHtml += `<div class="card-custom-row"><span class="lbl">${esc(fd.label)}:</span> ${highlightMatch(String(disp), State.searchQuery)}</div>`;
          }
        }

        const firstPhoto = (p.photos && p.photos.length > 0) ? p.photos[0] : null;
        const thumbKey = firstPhoto ? (firstPhoto.thumbKey || firstPhoto.blobKey) : null;

        card.innerHTML = `
          <div class="card-thumb" data-thumb-key="${esc(thumbKey || '')}">
            <span>${esc(cat.icon)}</span>
            ${p.favorite ? `<div class="card-fav-badge" title="Favorite">♥</div>` : ''}
          </div>
          <div class="card-body">
            <div class="card-top-row">
              <h2 class="card-title">${highlightMatch(p.name, State.searchQuery)}</h2>
              <button class="card-more-btn" data-more="${esc(p.id)}" aria-label="Quick actions">⋯</button>
            </div>
            <div class="card-meta-row tabular-nums">
              <span class="status-badge ${p.status}">${p.status === 'visited' ? 'Visited' : 'Want to go'}</span>
              ${p.rating ? `<span class="rating-inline">★ ${p.rating}</span>` : ''}
              ${p.priceLevel ? `<span class="price-inline">${'$'.repeat(p.priceLevel)}</span>` : ''}
            </div>
            ${customHtml}
            ${p.address ? `<div class="card-address">${highlightMatch(p.address, State.searchQuery)}</div>` : ''}
            ${(p.tags && p.tags.length) ? `<div class="card-tags">${p.tags.slice(0, 3).map(t => `<span class="tag-chip">#${highlightMatch(t, State.searchQuery)}</span>`).join('')}</div>` : ''}
          </div>`;

        card.onclick = (e) => {
          if (e.target.closest('[data-more]')) {
            e.stopPropagation();
            openQuickCardMenu(p);
            return;
          }
          openPlaceDetail(p.id);
        };

        listEl.appendChild(card);

        if (thumbKey) {
          DB.getPhotoUrl(thumbKey).then(url => {
            if (url) {
              const box = card.querySelector('.card-thumb');
              if (box) {
                const favHtml = p.favorite ? `<div class="card-fav-badge">♥</div>` : '';
                box.innerHTML = `<img src="${url}" loading="lazy" alt="${esc(p.name)}">${favHtml}`;
              }
            }
          });
        }
      }

      main.innerHTML = '';
      main.appendChild(listEl);
    }

    function openQuickCardMenu(place) {
      const nextStatus = place.status === 'visited' ? 'want' : 'visited';
      openModal(place.name, `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn-secondary" id="qm-status" style="justify-content:flex-start;">
            🔄 Switch to "${nextStatus === 'visited' ? 'Visited' : 'Want to go'}"
          </button>
          <button class="btn-secondary" id="qm-fav" style="justify-content:flex-start;">
            ${place.favorite ? '💔 Remove favorite' : '❤️ Mark as favorite'}
          </button>
          <button class="btn-secondary" id="qm-edit" style="justify-content:flex-start;">
            ✏️ Edit place
          </button>
          <button class="btn-danger" id="qm-del" style="justify-content:flex-start;">
            🗑️ Delete place
          </button>
        </div>
      `, () => {
        document.getElementById('qm-status').onclick = async () => {
          place.status = nextStatus;
          if (nextStatus === 'visited' && !place.visitedAt) place.visitedAt = new Date().toISOString().slice(0, 10);
          place.updatedAt = new Date().toISOString();
          await DB.put('places', place);
          closeModal();
          renderAll();
        };
        document.getElementById('qm-fav').onclick = async () => {
          place.favorite = !place.favorite;
          place.updatedAt = new Date().toISOString();
          await DB.put('places', place);
          closeModal();
          renderAll();
        };
        document.getElementById('qm-edit').onclick = () => {
          closeModal();
          openPlaceForm(place);
        };
        document.getElementById('qm-del').onclick = () => {
          closeModal();
          deletePlaceWithUndo(place);
        };
      });
    }

    async function deletePlaceWithUndo(place) {
      const idx = State.places.findIndex(p => p.id === place.id);
      if (idx === -1) return;
      State.places.splice(idx, 1);
      await DB.delete('places', place.id);
      closeSheet();
      renderAll();

      let undone = false;
      showToast(`Deleted "${place.name}"`, 'Undo', async () => {
        undone = true;
        State.places.push(place);
        await DB.put('places', place);
        renderAll();
      }, 5000);

      setTimeout(async () => {
        if (!undone && place.photos) {
          for (const ph of place.photos) {
            await DB.delete('photos', ph.blobKey);
            if (ph.thumbKey) await DB.delete('photos', ph.thumbKey);
            DB.revokePhotoUrl(ph.blobKey);
            if (ph.thumbKey) DB.revokePhotoUrl(ph.thumbKey);
          }
        }
      }, 5500);
    }

    /* ==========================================================================

    function closeSheet() {
      const sheet = document.getElementById('overlay-sheet');
      sheet.classList.remove('open');
      sheet.setAttribute('aria-hidden', 'true');
      sheet.innerHTML = '';
    }

    async function openPlaceDetail(placeId) {
      const place = State.places.find(p => p.id === placeId);
      if (!place) return;
      const cat = State.categories.find(c => c.id === place.categoryId) || { icon: '📍', name: 'Other', fields: [] };
      const sheet = document.getElementById('overlay-sheet');

      // Put 'menu' photos first in the carousel
      const sortedPhotos = [...(place.photos || [])].sort((a, b) => (a.kind === 'menu' ? -1 : b.kind === 'menu' ? 1 : 0));
      const kindLabels = { menu: '📋 Menu', food: '🍲 Food', place: '🏠 Space', other: '📷 Other' };

      // Custom fields Notion table
      let customRows = '';
      for (const fd of (cat.fields || []).sort((a, b) => a.order - b.order)) {
        const val = place.customValues ? place.customValues[fd.id] : undefined;
        if (val === undefined || val === '' || val === null || (Array.isArray(val) && val.length === 0)) continue;
        let renderedVal = esc(val);
        if (fd.type === 'checkbox') renderedVal = val ? '✅ Yes' : 'No';
        else if (fd.type === 'multiselect' && Array.isArray(val)) renderedVal = val.map(v => `<span class="tag-chip">${esc(v)}</span>`).join(' ');
        else if (fd.type === 'url') renderedVal = `<a href="${esc(val)}" target="_blank" rel="noopener">${esc(val)}</a>`;
        else if (fd.type === 'rating') renderedVal = `<span class="rating-inline">★ ${esc(val)}</span>`;
        customRows += `<div class="props-row"><div class="props-label">${esc(fd.label)}</div><div class="props-val">${renderedVal}</div></div>`;
      }

      const mapsHref = place.mapUrl || (place.lat && place.lng ? `https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}` : '');

      sheet.innerHTML = `
        <div class="sheet-header">
          <button class="icon-btn" id="btn-detail-back" aria-label="Back">←</button>
          <span class="sheet-title">${esc(place.name)}</span>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn" id="btn-detail-fav" aria-label="Favorite">${place.favorite ? '❤️' : '🤍'}</button>
            <button class="btn-secondary" id="btn-detail-edit" style="min-height:36px;padding:0 12px;">Edit</button>
          </div>
        </div>
        <div class="sheet-body">
          ${sortedPhotos.length > 0 ? `<div class="carousel-wrap" id="detail-carousel"></div>` : ''}

          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
            <span class="tag-chip" style="font-size:0.88rem;padding:4px 10px;">${esc(cat.icon)} ${esc(cat.name)}</span>
            <button class="status-badge ${place.status}" id="btn-detail-toggle-status" style="min-height:34px;padding:4px 12px;font-size:0.88rem;">
              ${place.status === 'visited' ? '✓ Visited (tap to change)' : '☆ Want to go (tap to change)'}
            </button>
          </div>

          <h1 style="font-size:1.5rem;margin:4px 0 10px;">${esc(place.name)}</h1>

          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">
            <div id="detail-star-mount"></div>
            <div class="price-inline tabular-nums" style="font-size:1.05rem;">${place.priceLevel ? '$'.repeat(place.priceLevel) : 'No price noted'}</div>
          </div>

          ${customRows ? `<div class="props-table">${customRows}</div>` : ''}

          ${place.review ? `<div class="detail-review-box">${esc(place.review)}</div>` : ''}

          ${(place.tags && place.tags.length) ? `<div class="card-tags" style="margin:12px 0;">${place.tags.map(t => `<span class="tag-chip" style="font-size:0.85rem;padding:4px 9px;">#${esc(t)}</span>`).join('')}</div>` : ''}

              <div class="props-row">

                  </div>
                </div>
              </div>` : (mapsHref ? `
              <div class="props-row">
                <div class="props-label">Map</div>
                <div class="props-val"><a href="${esc(mapsHref)}" target="_blank" rel="noopener">Open in Google Maps ↗</a></div>
              </div>` : '')}
            ${place.hours ? `<div class="props-row"><div class="props-label">Opening hours</div><div class="props-val">${esc(place.hours)}</div></div>` : ''}
            ${place.visitedAt ? `<div class="props-row"><div class="props-label">Last visited</div><div class="props-val tabular-nums">${esc(place.visitedAt)}</div></div>` : ''}
          </div>

          <div style="margin-top:24px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);font-size:0.8rem;">
